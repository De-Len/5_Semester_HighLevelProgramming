name: CI Pipeline

on:
  push:
    branches: [ main, master, CI-CD ]
  pull_request:
    branches: [ main, master, CI-CD ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Установка Gradle (без использования wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # Теперь используем просто 'gradle' вместо './gradlew'
      - name: Clean
        run: gradle clean

      - name: Build JAR
        run: gradle shadowJar

      # 4. Анализ качества кода (пример для SonarCloud)
#      - name: SonarCloud Scan
#        uses: SonarSource/sonarcloud-github-action@master
#        env:
#          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 5. Оповещение в Telegram
      - name: Telegram Notification
        if: always()
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "text=✅ Pipeline ${{ job.status }} for PR#${{ github.event.pull_request.number }}"